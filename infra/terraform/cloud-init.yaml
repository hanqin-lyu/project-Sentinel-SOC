#cloud-config
# Minimal bootstrap: install auditd and log every execve by real (login) users.
# Decoy account, sshd port change and audit->syslog forwarding are Phase 1 manual steps.
package_update: true
packages:
  - auditd

write_files:
  - path: /etc/audit/rules.d/exec.rules
    permissions: "0640"
    content: |
      -a always,exit -F arch=b64 -S execve -F auid>=1000 -F auid!=4294967295 -k exec_cmd

runcmd:
  - [ systemctl, enable, --now, auditd ]
  - [ augenrules, --load ]
