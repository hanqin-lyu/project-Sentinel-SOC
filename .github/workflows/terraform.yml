# One pipeline for all Terraform.
#   Pull request: CI jobs with the read-only CI identity. Merge only after they pass.
#   Merge to main: a deployment request for the "production-demo" environment.
#                  After the owner approves it, the read-write CD identity applies.
name: Terraform

on:
  # No path filter: "Terraform Plan Preview" is a required check on main, so
  # every pull request must report it, even one that only changes docs.
  pull_request:
    branches: [main]
  # Only Terraform changes reach the apply job.
  push:
    branches: [main]
    paths:
      - "*.tf"
      - ".terraform.lock.hcl"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  BACKEND_CONFIG: >-
    -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}
    -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    -backend-config=container_name=${{ vars.TFSTATE_CONTAINER }}
  TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
  TF_VAR_management_source_cidr: ${{ secrets.MANAGEMENT_SOURCE_CIDR }}

jobs:
  fmt-and-validate:
    name: "Terraform Format & Validate"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CI_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_CI_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false $BACKEND_CONFIG

      - name: Terraform validate
        run: terraform validate

  checkov-scan:
    name: "Pre-deployment Security Scan (Checkov)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,secrets
          # AVM resources live inside registry modules; without this Checkov
          # only sees the module call arguments.
          download_external_modules: true
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false
          # Skipped checks, each with a reason:
          # CKV_TF_1 - module sources are Terraform Registry versions, not git
          #            commit hashes; the modules nested inside AVM cannot be
          #            changed or skipped inline.
          # Honeypot-by-design findings are skipped inline in honeypot.tf.
          skip_check: CKV_TF_1

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  secret-scan:
    name: "Secret Scan (gitleaks)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans the checked-out files (not just the PR diff), so secrets already
      # in the repo are found too. Exit code 1 = leaks found.
      - name: Run gitleaks on working tree
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            dir /repo --config /repo/.gitleaks.toml --redact --verbose

  terraform-plan:
    name: "Terraform Plan Preview"
    needs: [fmt-and-validate, checkov-scan, secret-scan]
    runs-on: ubuntu-latest
    # Same group as apply, so plan and apply never contend for the state lock.
    concurrency:
      group: terraform
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CI_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_CI_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false $BACKEND_CONFIG

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Plan to job summary
        run: |
          {
            echo "### Terraform plan"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-apply:
    name: "Terraform Apply"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Manual approval gate: Required reviewers on this environment in GitHub.
    # The CD identity's federated credential only matches this environment.
    environment: production-demo
    # Serialise runs against the same state; never cancel an in-flight apply.
    concurrency:
      group: terraform
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CD_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_CD_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false $BACKEND_CONFIG

      - name: Terraform apply
        run: terraform apply -input=false -no-color -auto-approve
